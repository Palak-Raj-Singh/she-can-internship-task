<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Can Foundation - Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card form-container">
        
        <form id="mainForm" novalidate>
            
            <div class="logo-wrapper">
                <img src="logo.png" alt="She Can Foundation Logo" class="brand-logo">
            </div>

            <div class="text-center mb-6">
                <h2 class="brand-heading" style="margin-top:0;">She Can Foundation</h2>
                <p style="font-size: 0.78rem; color: var(--text-muted); margin: 0;">Internship Application Submission Form</p>
            </div>
    
            <div class="mb-4">
                <label class="field-label">Full Name</label>
                <input class="form-input" type="text" id="name" placeholder="Jane Doe">
                <p class="error-text hidden" id="nameError">Name must be at least 2 characters.</p>
            </div>

            <div class="mb-4">
                <label class="field-label">Email Address</label>
                <input class="form-input" type="email" id="email" placeholder="jane@example.com">
                <p class="error-text hidden" id="emailError">Please enter a valid email address.</p>
            </div>

            <div class="mb-5">
                <label class="field-label">Message</label>
                <textarea class="form-input" id="message" placeholder="Your message..." style="min-height: 100px; resize: vertical;"></textarea>
                <p class="error-text hidden" id="messageError">Message cannot be empty.</p>
            </div>

            <button class="btn-primary" type="submit" id="submitBtn">
                Submit Application
            </button>
            
            <div class="text-center mt-4">
                <a href="login.html" style="font-size: 0.75rem; color: var(--brand-orange); font-weight: 600; text-decoration: none;">Open Admin Portal →</a>
            </div>
        </form>

    </div>

    <script>
        document.getElementById('mainForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const message = document.getElementById('message');
            let valid = true;

            // 1. Full Name Validation
            if (name.value.trim().length < 2) { 
                document.getElementById('nameError').classList.remove('hidden'); 
                name.classList.add('input-error'); 
                valid = false; 
            } else { 
                document.getElementById('nameError').classList.add('hidden'); 
                name.classList.remove('input-error'); 
            }

            // 2. Email Pattern Validation
            if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email.value.trim())) { 
                document.getElementById('emailError').classList.remove('hidden'); 
                email.classList.add('input-error'); 
                valid = false; 
            } else { 
                document.getElementById('emailError').classList.add('hidden'); 
                email.classList.remove('input-error'); 
            }

            // 3. Message Input Validation
            if (!message.value.trim()) { 
                document.getElementById('messageError').classList.remove('hidden'); 
                message.classList.add('input-error'); 
                valid = false; 
            } else { 
                document.getElementById('messageError').classList.add('hidden'); 
                message.classList.remove('input-error'); 
            }

            // STOP execution here if any field failed validation
            if (!valid) return;

            // If valid, secure the button state and send to backend
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing Backend Write...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.value, email: email.value, message: message.value })
                });

                if (response.ok) {
                    // Only redirect if the server successfully writes to database
                    window.location.href = 'success.html';
                } else {
                    alert("Server rejection: Please verify your entries.");
                    btn.innerText = "Submit Application";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Network communication error.");
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
