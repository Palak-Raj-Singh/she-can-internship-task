<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

    <div class="app-card dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
            <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--brand-orange); margin: 0;">Admin Dashboard Logs</h2>
            
            <input type="text" id="searchInput" placeholder="Search by name or email..." style="padding: 0.5rem 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; outline: none; font-size: 0.875rem; width: 250px;">
            
            <a href="index.html" class="btn-secondary" style="text-decoration: none;">← Back to Form</a>
        </div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message Input</th>
                        <th>Actions</th> </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

<script>
        let allSubmissions = [];
        let token = sessionStorage.getItem('adminToken');

        // SECURITY CHECKPOINT: If no token exists, route them instantly to the login page
        if (!token) {
            window.location.href = 'login.html';
        }

        async function fetchSubmissions() {
            const res = await fetch('/api/admin/data', {
                headers: { 'Authorization': token }
            });

            if (res.status === 401) {
                sessionStorage.removeItem('adminToken');
                window.location.href = 'login.html'; // Boot them out if token is malicious or expired
                return;
            }

            allSubmissions = await res.json();
            renderTable(allSubmissions);
        }

        function renderTable(data) {
            const body = document.getElementById('tableBody');

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 1rem; color: var(--text-muted);">No database entries found.</td></tr>`;
                return;
            }

            body.innerHTML = data.map(row => `
                <tr>
                    <td style="color: var(--text-muted); white-space: nowrap;">${row.date}</td>
                    <td style="font-weight: 600;">${row.name}</td>
                    <td>${row.email}</td>
                    <td style="color: #475569;">${row.message}</td>
                    <td>
                        <button onclick="deleteSubmission(${row.id})" style="background-color: var(--error); color: white; border: none; padding: 0.35rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.75rem; font-weight: 600;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allSubmissions.filter(row => 
                row.name.toLowerCase().includes(term) || 
                row.email.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        async function deleteSubmission(id) {
            if (!confirm("Are you sure you want to delete this entry?")) return;
            
            const res = await fetch(`/api/admin/delete/${id}`, { 
                method: 'DELETE',
                headers: { 'Authorization': token }
            });

            if (res.ok) {
                fetchSubmissions();
            } else {
                alert("Failed to delete entry. Unauthorized session.");
            }
        }

        // Initialize table data load
        fetchSubmissions();
    </script>
</body>
</html>
